<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gnocca - Personal_G</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#f5f5f3; --surface:#ffffff; --surface-2:#fafaf9;
    --text:#18181a; --text-secondary:#63625c; --text-muted:#8b8a83;
    --border:#e4e3dd; --border-strong:#cfcec6;
    --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --yellow:#eda100;
    --magenta:#e87ba4; --green:#008300; --violet:#4a3aa7; --red:#e34948; --gray:#9a998f;
    --accent:#e0245e;
    --btn-solid-bg:#18181a; --btn-solid-fg:#ffffff;
  }
  body.theme-dark{
    --bg:#141417; --surface:#1c1c21; --surface-2:#24242b;
    --text:#f1f0ed; --text-secondary:#b6b4ae; --text-muted:#87867f;
    --border:#323239; --border-strong:#44444d;
    --btn-solid-bg:#f1f0ed; --btn-solid-fg:#18181a;
  }
  *{box-sizing:border-box;}
  @keyframes modalPop{from{opacity:0; transform:translateY(6px) scale(0.98);} to{opacity:1; transform:translateY(0) scale(1);}}
  @keyframes overlayFade{from{opacity:0;} to{opacity:1;}}
  @keyframes sectionFade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @keyframes detailFade{from{opacity:0;} to{opacity:1;}}
  @keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:24px; overflow-x:hidden;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .wrap{max-width:1600px; margin:0 auto;}
  h1{font-size:22px; font-weight:500; margin:0 0 4px;}
  .title-row{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .title-row h1{margin:0 0 4px;}
  .brand-logo{width:36px; height:36px; border-radius:8px; object-fit:cover; flex-shrink:0;}
  .subtitle{color:var(--text-secondary); font-size:14px; margin:0 0 20px;}
  .app-layout{display:flex; gap:24px; align-items:flex-start;}
  .sidebar{width:230px; flex-shrink:0; background:var(--surface); border:0.5px solid var(--border); border-radius:16px; padding:16px 10px; position:sticky; top:24px;}
  .side-label{font-size:11px; font-weight:500; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em; padding:10px 12px 6px;}
  .side-btn{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:none; padding:11px 14px; border-radius:14px; font-size:14px; color:var(--text-secondary); cursor:pointer; margin-bottom:2px; transition:background 0.15s ease, color 0.15s ease;}
  .side-btn i{width:18px; text-align:center; font-size:15px; color:var(--text-muted);}
  .side-count{margin-left:auto; font-size:11px; color:var(--text-muted);}
  .side-btn:hover{background:var(--surface-2); color:var(--text);}
  .side-btn:hover i{color:var(--text);}
  .side-btn.active{background:var(--surface-2); color:var(--text); font-weight:500;}
  .side-btn.active i{color:var(--accent);}
  .side-btn.active:hover{background:var(--surface-2);}
  .side-btn.disabled{color:var(--text-muted); cursor:default; opacity:0.6;}
  .side-btn.disabled i{color:var(--text-muted); opacity:0.6;}
  .side-btn.disabled:hover{background:none; color:var(--text-muted);}
  .side-btn.disabled:hover i{color:var(--text-muted);}
  .side-divider{height:0.5px; background:var(--border); margin:10px 6px;}
  .main-content{flex:1; min-width:0;}
  .app-section{display:none;}
  .app-section.active{display:block; animation:sectionFade 0.22s ease;}
  .pill-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .pill-btn{background:var(--surface); border:0.5px solid var(--border-strong); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--text-secondary); cursor:pointer; transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;}
  .pill-btn.active{background:var(--btn-solid-bg); color:var(--btn-solid-fg); border-color:var(--btn-solid-bg);}
  .dataset-panel{display:none;}
  .dataset-panel.active{display:block;}
  @media (max-width:760px){
    .app-layout{flex-direction:column;}
    .sidebar{width:100%; position:static;}
    body{padding:14px;}
    .charts-grid{grid-template-columns:1fr;}
    .cm-fields{grid-template-columns:1fr;}
    .filters input{width:100%;}
    .filters select{flex:1 1 140px;}
    .kpi-grid{grid-template-columns:repeat(auto-fit, minmax(140px,1fr));}
    .riepilogo-detail-row{gap:6px;}
    .rd-nome{flex:0 0 auto; width:auto; max-width:100%; white-space:normal;}
    .rd-badge-stato, .rd-badge-percorso{flex:0 0 auto; width:auto;}
    .rd-fine{margin-left:0;}
    .panel{padding:14px;}
    .pill-tabs{gap:6px;}
    .pill-btn{padding:7px 12px; font-size:12px;}
    .btn-add{width:100%; justify-content:center;}
    .btn-export{width:100%; justify-content:center; margin-left:0;}
    .contatti-list{max-height:none;}
    .contatto-row{align-items:center; gap:6px; background:var(--surface); border:0.5px solid var(--border); border-bottom:0.5px solid var(--border); border-radius:12px; margin-bottom:8px; padding:10px 12px;}
    .contatto-row:last-child{margin-bottom:0;}
    .cr-info{min-width:0; width:100%; flex-basis:100%;}
    .cr-nome{flex:0 0 auto; width:auto; max-width:100%; white-space:normal;}
    .cr-badge-stato, .cr-badge-percorso{flex:0 0 auto; width:auto;}
    .cr-date{flex-direction:row; align-items:center; justify-content:space-between; min-width:0; width:100%; flex-basis:100%;}
    .cr-select{flex:1 1 45%; width:auto; min-width:0;}
    .cr-note{flex:1 1 45%; width:auto; min-width:0;}
    .detail-box{gap:12px;}
    .detail-actions{width:100%; justify-content:flex-start;}
    .modal-box{padding:16px;}
    .table-wrap{overflow-x:visible; max-height:none;}
    .table-wrap table{display:block; width:100%;}
    .table-wrap thead{display:none;}
    .table-wrap tbody{display:block; width:100%;}
    .table-wrap tr.client-row{display:block; background:var(--surface); border:0.5px solid var(--border); border-radius:12px; margin-bottom:10px; padding:2px 0;}
    .table-wrap tr.client-row td{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 12px; border-bottom:0.5px dashed var(--border); white-space:normal; text-align:right;}
    .table-wrap tr.client-row td:last-child{border-bottom:none;}
    .table-wrap tr.client-row td::before{content:attr(data-label); font-size:11px; font-weight:500; color:var(--text-muted); text-align:left; flex-shrink:0;}
    .table-wrap tr.client-detail{margin:-6px 0 10px;}
    .table-wrap tr.client-detail.open{display:block;}
    .table-wrap tr.client-detail td{display:block; border-radius:0 0 12px 12px;}
  }
  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:20px;}
  .kpi{background:var(--surface); border:0.5px solid var(--border); border-radius:12px; padding:16px; position:relative;}
  .kpi .label{font-size:13px; color:var(--text-secondary); margin-bottom:6px;}
  .kpi .value{font-size:24px; font-weight:500;}
  .kpi .sub{font-size:12px; color:var(--text-muted); margin-top:4px;}
  .kpi-icon{position:absolute; top:14px; right:14px; font-size:14px; opacity:0.45;}
  .kpi-clickable{cursor:pointer; transition:filter 0.1s, box-shadow 0.1s;}
  .kpi-clickable:hover{filter:brightness(0.96); box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .kpi-clickable.kpi-open{outline:2px solid var(--text); outline-offset:-2px;}
  .riepilogo-detail-panel{margin-top:4px;}
  .riepilogo-detail-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .scadenze-mini-toggle{cursor:pointer; margin-bottom:0; user-select:none;}
  .scadenze-mini-toggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
  .scadenze-mini-count{font-size:13px; font-weight:400; color:var(--text-secondary); margin-left:2px;}
  .scadenze-mini-actions{display:flex; align-items:center; gap:12px;}
  .scadenze-mini-chevron{font-size:13px; color:var(--text-secondary); transition:transform 0.2s ease;}
  .scadenze-mini-chevron.open{transform:rotate(180deg);}
  .riepilogo-detail-head h2{margin:0;}
  .riepilogo-detail-list{max-height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:16px;}
  .riepilogo-detail-row{display:flex; align-items:center; gap:20px; padding:8px 4px; border-bottom:0.5px solid var(--border); font-size:13px; flex-wrap:wrap;}
  .riepilogo-detail-row:last-child{border-bottom:none;}
  .rd-nome{font-weight:500; flex:0 0 200px; width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rd-badge-stato{flex:0 0 110px; width:110px; text-align:center;}
  .rd-badge-percorso{flex:0 0 130px; width:130px; text-align:center;}
  .rd-fine{margin-left:auto; color:var(--text-secondary); font-size:12px; white-space:nowrap;}
  .rd-gg{flex:0 0 auto; margin-left:8px; white-space:nowrap;}
  .badge-gg-urgent{background:#fcebeb; color:#791f1f;}
  .badge-gg-soon{background:#faeeda; color:#633806;}
  .badge-gg-ok{background:var(--surface-2); color:var(--text-muted);}
  .panel{background:var(--surface); border:0.5px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px;}
  .panel h2{font-size:16px; font-weight:500; margin:0 0 4px;}
  .panel .desc{font-size:12px; color:var(--text-muted); margin:0 0 12px;}
  .charts-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(360px,1fr)); gap:16px; margin-bottom:16px;}
  .chart-box{position:relative; width:100%; height:280px;}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:6px; font-size:12px; color:var(--text-secondary);}
  .legend span.dot{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:4px;}
  .legend-item{display:flex; align-items:center;}
  .filters{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
  .filters select, .filters input{
    height:34px; border-radius:8px; border:0.5px solid var(--border-strong);
    background:var(--surface); color:var(--text); padding:0 10px; font-size:13px;
  }
  .filters input{width:200px;}
  .filters input.filters-search-wide{width:340px; max-width:100%;}
  .filter-select{position:relative; display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; flex-shrink:0;}
  .filter-select select{
    width:34px !important; height:34px !important; padding:0 !important; margin:0; border-radius:8px;
    border:0.5px solid var(--border-strong); background:var(--surface); color:transparent;
    text-align:center; text-indent:1px; cursor:pointer;
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
  }
  .filter-select select option{color:var(--text);}
  .filter-select i{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:13px; color:var(--text-secondary); pointer-events:none;}
  .filter-select.active select{border-color:var(--accent); background:var(--surface-2);}
  .filter-select.active i{color:var(--accent);}
  .filter-dot{position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:1.5px solid var(--surface); display:none;}
  .filter-select.active .filter-dot{display:block;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th, td{padding:11px 18px; text-align:left; border-bottom:0.5px solid var(--border); white-space:nowrap;}
  body.density-compact th, body.density-compact td{padding:6px 12px;}
  th:nth-child(3), td:nth-child(3){padding-right:8px;}
  th:nth-child(4), td:nth-child(4){padding-left:8px;}
  th{color:var(--text-secondary); font-weight:500; font-size:12px; cursor:pointer; user-select:none; position:sticky; top:0; background:var(--surface);}
  tbody tr:hover{background:var(--surface-2);}
  .badge{display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:500;}
  .client-name-cell{display:inline-flex; align-items:center; gap:8px;}
  .avatar{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; font-size:10px; font-weight:700; flex-shrink:0;}
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:40px 20px; color:var(--text-muted); text-align:center;}
  .empty-state i{font-size:26px; opacity:0.45;}
  .empty-state p{margin:0; font-size:13px;}
  .b-attivo{background:#e1f5ee; color:#085041;}
  .b-sospesa{background:#e6f1fb; color:#0c447c;}
  .b-sparita{background:#faeeda; color:#633806;}
  .b-mainiziato{background:#f1efe8; color:#444441;}
  .b-abbandono{background:#fcebeb; color:#791f1f;}
  .b-non-rinnovo{background:#efe9fb; color:#4a3aa7;}
  .b-vuoto{background:#f1efe8; color:#888780;}
  .b-perc-12{background:#fbe4ec; color:#9c1f56;}
  .b-perc-6{background:#c2185b; color:#ffffff;}
  .b-perc-altro{background:#f1efe8; color:#5f5e5a;}
  .b-perc-referral{background:#eaf3de; color:#27500a;}
  .b-perc-6-6gnocca{background:#fbe3d3; color:#8a3c0a;}
  .b-perc-4{background:#e6f1fb; color:#0c447c;}
  .b-perc-promo{background:#fcebeb; color:#791f1f;}
  .b-perc-gnocca4life{background:#eaf3de; color:#27500a;}
  .b-situ-attiva{background:#eaf3de; color:#27500a;}
  .b-situ-poco{background:#faeeda; color:#633806;}
  .b-situ-non{background:#fcebeb; color:#791f1f;}
  .b-situ-altro{background:#f1efe8; color:#5f5e5a;}
  .b-vend-salvatore{background:#d5f2d8; color:#1e6b2e;}
  .b-vend-personalg{background:#1c1c1a; color:#ffffff;}
  .b-vend-peppe{background:#e6f1fb; color:#0c447c;}
  .b-vend-altro{background:#e9e9e9; color:#555555;}
  .b-nutri-nicole{background:#fdf1d6; color:#8a5a00;}
  .b-nutri-alessia{background:#fcebeb; color:#791f1f;}
  .b-nutri-vanessa{background:#fbe4ec; color:#9c1f56;}
  .b-nutri-sofia{background:#eaf3de; color:#27500a;}
  .b-nutri-matilde{background:#e6f1fb; color:#0c447c;}
  .b-pt-fiorenzo{background:#fdf1d6; color:#8a5a00;}
  .b-pt-matteo{background:#dcedfa; color:#0f5c96;}
  .b-pt-federica{background:#fcebeb; color:#791f1f;}
  .b-pt-gianmiki{background:#e2e6ec; color:#37424f;}
  .b-pt-marco{background:#fbe3d3; color:#8a3c0a;}
  .table-wrap{max-height:520px; overflow-y:auto; overflow-x:auto; border-radius:8px; -webkit-overflow-scrolling:touch;}
  .count-tag{font-size:12px; color:var(--text-muted); margin-bottom:8px;}
  .note-cell{max-width:260px; white-space:normal;}
  .client-row{cursor:pointer;}
  .client-detail{display:none;}
  .client-detail.open{display:table-row;}
  .client-detail td{background:var(--surface-2); padding:12px 14px;}
  .detail-box{display:flex; flex-wrap:wrap; align-items:center; gap:24px; font-size:13px; color:var(--text-secondary); animation:detailFade 0.18s ease;}
  .detail-box a{color:var(--accent); text-decoration:underline;}
  .detail-box a:hover{opacity:0.8;}
  .detail-box i{margin-right:6px; color:var(--text-muted);}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .sync-tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-bottom:10px;}
  .sync-dot{width:8px; height:8px; border-radius:50%; background:var(--aqua); display:inline-block;}
  .contatti-list{max-height:600px; overflow-y:auto; border-radius:8px;}
  .contatto-row{display:flex; align-items:center; gap:14px; padding:10px 4px; border-bottom:0.5px solid var(--border); flex-wrap:wrap;}
  .contatto-row:last-child{border-bottom:none;}
  .cr-info{flex:1 1 260px; min-width:220px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cr-nome{font-weight:500; font-size:14px; flex:0 0 180px; width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cr-badge-stato{flex:0 0 100px; width:100px; text-align:center;}
  .cr-badge-percorso{flex:0 0 110px; width:110px; text-align:center;}
  .cr-meta{font-size:12px; color:var(--text-secondary);}
  .cr-date{display:flex; flex-direction:column; align-items:flex-end; min-width:100px; font-size:12px; color:var(--text-secondary);}
  .cr-gg{font-weight:500; font-size:12px;}
  .gg-ok{color:var(--text-muted);}
  .gg-soon{color:#8a5a00;}
  .gg-urgent{color:#a32d2d;}
  .cr-select{height:32px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--text); font-size:12px; padding:0 8px; font-weight:500;}
  .cr-select.st-da-contattare{background:#faeeda; color:#633806; border-color:#f0997b;}
  .cr-select.st-contattato{background:#e6f1fb; color:#0c447c; border-color:#85b7eb;}
  .cr-select.st-rinnovato{background:#eaf3de; color:#3b6d11; border-color:#97c459;}
  .cr-select.st-non-rinnova{background:#fcebeb; color:#791f1f; border-color:#f09595;}
  .cr-note{height:32px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--text); font-size:12px; padding:0 8px; width:200px;}
  .btn-add{display:inline-flex; align-items:center; gap:6px; background:var(--btn-solid-bg); color:var(--btn-solid-fg); border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; margin-bottom:12px;}
  .btn-add:hover{opacity:0.88;}
  .btn-export{display:inline-flex; align-items:center; gap:6px; margin-left:8px; margin-bottom:12px;}
  .btn-icon-add{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; border:none; background:var(--btn-solid-bg); color:var(--btn-solid-fg); font-size:14px; cursor:pointer; flex-shrink:0;}
  .btn-icon-add:hover{opacity:0.88;}
  .detail-actions{display:flex; gap:8px; margin-left:auto;}
  .btn-icon{display:inline-flex; align-items:center; gap:6px; background:none; border:0.5px solid var(--border-strong); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--text-secondary); cursor:pointer;}
  .btn-icon:hover{background:var(--surface); color:var(--text);}
  .btn-icon:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-icon:disabled:hover{background:none; color:var(--text-secondary);}
  .dash-month-picker{display:flex; align-items:center; justify-content:flex-end; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .dash-month-switch{display:flex; align-items:center; gap:8px;}
  .dash-month-current{font-size:13px; font-weight:500; min-width:110px; text-align:center; text-transform:capitalize;}
  .btn-delete-client:hover{color:#a32d2d; border-color:#f09595;}
  .azioni-cell{display:flex; gap:6px;}
  .modal-overlay{position:fixed; inset:0; background:rgba(15,15,14,0.5); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px;}
  .modal-overlay{animation:overlayFade 0.15s ease;}
  .modal-box{background:var(--surface); border-radius:14px; padding:22px; width:min(600px,100%); max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,0.3); animation:modalPop 0.18s ease;}
  .modal-box h2{margin:0 0 14px; font-size:17px; font-weight:500;}
  .cm-steps{display:flex; align-items:center; gap:6px; margin-bottom:18px;}
  .cm-step-dot{width:22px; height:22px; border-radius:50%; background:var(--surface-2); border:0.5px solid var(--border-strong); color:var(--text-secondary); font-size:11px; font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cm-step-dot.active{background:var(--btn-solid-bg); border-color:var(--btn-solid-bg); color:var(--btn-solid-fg);}
  .cm-step-dot.done{border-color:var(--accent); color:var(--accent);}
  .cm-step-line{flex:1; height:1px; background:var(--border-strong);}
  .cm-groups{display:flex; flex-direction:column; gap:18px;}
  .cm-group-title{font-size:11px; font-weight:500; color:var(--accent); text-transform:uppercase; letter-spacing:0.03em; margin:0 0 8px;}
  .cm-fields{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  .cm-field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-secondary);}
  .cm-field.cm-wide{grid-column:1 / -1;}
  .cm-field input, .cm-field select, .cm-field textarea{
    height:36px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--text); padding:0 10px; font-size:13px; font-family:inherit;
  }
  .cm-field textarea{height:auto; padding:8px 10px; resize:vertical;}
  .cm-actions{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px;}
  .cm-actions-nav{display:flex; gap:10px;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:0.5px solid var(--border-strong); border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; transition:background 0.15s ease, opacity 0.15s ease;}
  .btn-primary{background:var(--btn-solid-bg); color:var(--btn-solid-fg); border:none; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer;}
  .wa-box{width:min(360px,100%);}
  .wa-number{font-size:13px; color:var(--text-secondary); margin:0 0 14px;}
  .wa-pills{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .wa-pill{background:var(--surface-2); color:var(--text); border:0.5px solid var(--border-strong); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--text-secondary); cursor:pointer; transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;}
  .wa-pill.active{background:var(--btn-solid-bg); border-color:var(--btn-solid-bg); color:var(--btn-solid-fg);}
  #wa-message{width:100%; min-height:110px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--text); padding:10px 12px; font-size:13px; font-family:inherit; resize:vertical; box-sizing:border-box;}
  .wa-open-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; background:#25d366; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; transition:opacity 0.15s ease;}
  .wa-open-btn:hover{opacity:0.88;}
  .settings-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:16px; align-items:start;}
  .opt-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .opt-tab{background:var(--surface-2); color:var(--text-secondary); border:0.5px solid var(--border-strong); border-radius:999px; padding:6px 14px; font-size:12px; cursor:pointer; transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;}
  .opt-tab.active{background:var(--btn-solid-bg); border-color:var(--btn-solid-bg); color:var(--btn-solid-fg);}
  .settings-tabs{margin-bottom:20px;}
  .settings-tabs .opt-tab{font-size:13px; padding:8px 16px; gap:6px;}
  .settings-tabs .opt-tab i{margin-right:4px;}
  .opt-group{margin-bottom:18px;}
  .opt-group:last-child{margin-bottom:0;}
  .opt-group h3{font-size:13px; font-weight:500; margin:0 0 8px;}
  .opt-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .opt-chip{display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:999px; padding:5px 6px 5px 12px; font-size:12px; color:var(--text);}
  .opt-chip button{background:none; border:none; color:var(--text-muted); cursor:pointer; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px;}
  .opt-chip button:hover{background:var(--border); color:var(--text);}
  .opt-add{display:flex; gap:8px;}
  .opt-add input{flex:1; height:32px; border-radius:8px; border:0.5px solid var(--border-strong); background:var(--surface); color:var(--text); padding:0 10px; font-size:12px;}
  .opt-add button{height:32px; border-radius:8px; border:none; background:var(--btn-solid-bg); color:var(--btn-solid-fg); padding:0 12px; font-size:12px; cursor:pointer;}
  .status-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:10px;}
  .status-dot{width:9px; height:9px; border-radius:50%; background:var(--aqua); flex-shrink:0;}
  .status-dot.offline{background:var(--red);}
  .settings-counts{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
  .settings-count{background:var(--surface-2); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--text-secondary); min-width:90px;}
  .settings-count b{display:block; font-size:18px; color:var(--text); font-weight:500;}
  .appearance-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:0.5px solid var(--border);}
  .appearance-row:last-child{border-bottom:none;}
  .appearance-row .label{font-size:13px;}
  .appearance-row .desc{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .seg-toggle{display:flex; border:0.5px solid var(--border-strong); border-radius:8px; overflow:hidden;}
  .seg-toggle button{background:var(--surface); border:none; padding:7px 14px; font-size:12px; color:var(--text-secondary); cursor:pointer;}
  .seg-toggle button.active{background:var(--btn-solid-bg); color:var(--btn-solid-fg);}
  .swatches{display:flex; gap:8px;}
  .swatch{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.active{border-color:var(--btn-solid-bg);}
  #app-wrap{display:none;}
  #login-overlay{display:flex;}
  .login-box{width:min(360px,100%);}
  .login-box .title-row{margin-bottom:20px; justify-content:center;}
  .login-box .title-row h1{font-size:18px; margin:0;}
  .login-box .cm-field{margin-bottom:12px;}
  .login-box .cm-field span{margin-bottom:4px; display:block;}
  .login-box .cm-field input{width:100%;}
  .login-error{color:var(--red); font-size:12px; margin:0 0 12px; display:none;}
  #logout-btn{color:var(--red);}
  #logout-btn i{color:var(--red);}
  .conn-status{position:fixed; bottom:16px; right:16px; max-width:min(320px,calc(100vw - 32px)); background:#3a2410; color:#f0c26b; padding:10px 16px; border-radius:10px; font-size:12px; font-weight:500; display:none; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,0.28); z-index:2000;}
  .conn-status.show{display:flex;}
  .btn-danger{background:var(--red); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer;}
  .toast-stack{position:fixed; bottom:16px; left:16px; display:flex; flex-direction:column; gap:8px; z-index:3000; max-width:min(360px, calc(100vw - 32px));}
  .toast{display:flex; align-items:center; gap:10px; background:var(--surface); color:var(--text); border:0.5px solid var(--border-strong); border-radius:10px; padding:12px 16px; font-size:13px; box-shadow:0 12px 30px rgba(0,0,0,0.2); opacity:0; transform:translateY(8px); transition:opacity 0.2s ease, transform 0.2s ease;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast-success i{color:var(--aqua);}
  .toast-error i{color:var(--red);}
  .toast-info i{color:var(--blue);}
</style>
</head>

import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAruE1f4iKlGgVO6TjLNd03X01-aD4Hlng",
  authDomain: "dashboard-gnocca.firebaseapp.com",
  projectId: "dashboard-gnocca",
  storageBucket: "dashboard-gnocca.firebasestorage.app",
  messagingSenderId: "919378148982",
  appId: "1:919378148982:web:f35c90393c80e18d67e957"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const CONTATTI_COLLECTION = 'contatti_gnocca';
const contattiState = {};
const contattiListeners = [];

function slug(s){
  return (s||'').normalize('NFD').replace(new RegExp('[\u0300-\u036f]','g'),'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
}

// ================= STATO CONNESSIONE =================
let firestoreError = false;
function updateConnStatus(){
  const el = document.getElementById('conn-status');
  const textEl = document.getElementById('conn-status-text');
  if(!el || !textEl) return;
  const offline = !navigator.onLine || firestoreError;
  el.classList.toggle('show', offline);
  textEl.textContent = !navigator.onLine
    ? 'Sei offline: le modifiche verranno sincronizzate al ritorno della connessione.'
    : 'Problema di connessione con il database: alcune modifiche potrebbero non essere salvate.';
}
window.addEventListener('online', updateConnStatus);
window.addEventListener('offline', updateConnStatus);
updateConnStatus();

// ================= LOGIN / AUTENTICAZIONE =================
let firestoreListenersStarted = false;
function startFirestoreListeners(){
  if(firestoreListenersStarted) return;
  firestoreListenersStarted = true;

  onSnapshot(collection(db, CONTATTI_COLLECTION), snap => {
    firestoreError = false; updateConnStatus();
    snap.docChanges().forEach(change => {
      const id = change.doc.id;
      const docData = change.doc.exists() ? change.doc.data() : {};
      contattiState[id] = docData;
      contattiListeners.forEach(fn => fn(id, docData));
    });
  }, ()=>{ firestoreError = true; updateConnStatus(); });

  Object.keys(CLIENTI_COLLECTIONS).forEach(key=>{
    onSnapshot(collection(db, CLIENTI_COLLECTIONS[key]), snap=>{
      firestoreError = false; updateConnStatus();
      snap.docChanges().forEach(change=>{
        const id = change.doc.id;
        if(change.type==='removed'){ delete clientOverrides[key][id]; }
        else{
          const data = change.doc.data();
          clientOverrides[key][id] = data._deleted ? {_deleted:true} : {...data};
        }
      });
      rebuildDataset(key);
    }, ()=>{ firestoreError = true; updateConnStatus(); });
  });

  onSnapshot(doc(db, SETTINGS_COLLECTION, SETTINGS_DOC_ID), snap=>{
    firestoreError = false; updateConnStatus();
    if(snap.exists()){
      const data = snap.data();
      Object.keys(OPTION_LISTS).forEach(key=>{
        if(Array.isArray(data[key])){
          const arr = OPTION_LISTS[key];
          arr.length = 0;
          data[key].forEach(v=>arr.push(v));
        }
      });
    }
    if(typeof sectionInitialized!=='undefined' && sectionInitialized.impostazioni) renderImpostazioni();
  }, ()=>{ firestoreError = true; updateConnStatus(); });
}

const loginOverlay = document.getElementById('login-overlay');
const appWrap = document.getElementById('app-wrap');
const loginEmailEl = document.getElementById('login-email');
const loginPasswordEl = document.getElementById('login-password');
const loginErrorEl = document.getElementById('login-error');
const loginSubmitEl = document.getElementById('login-submit');

onAuthStateChanged(auth, user=>{
  if(user){
    loginOverlay.style.display = 'none';
    appWrap.style.display = 'block';
    startFirestoreListeners();
  } else {
    loginOverlay.style.display = 'flex';
    appWrap.style.display = 'none';
  }
});

function doLogin(){
  const email = (loginEmailEl.value||'').trim();
  const password = loginPasswordEl.value||'';
  loginErrorEl.style.display = 'none';
  if(!email || !password){
    loginErrorEl.textContent = 'Inserisci email e password.';
    loginErrorEl.style.display = 'block';
    return;
  }
  loginSubmitEl.disabled = true;
  signInWithEmailAndPassword(auth, email, password)
    .catch(()=>{
      loginErrorEl.textContent = 'Accesso non riuscito. Controlla email e password.';
      loginErrorEl.style.display = 'block';
    })
    .finally(()=>{ loginSubmitEl.disabled = false; });
}
loginSubmitEl.addEventListener('click', doLogin);
[loginEmailEl, loginPasswordEl].forEach(el=>{
  el.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
});
document.getElementById('logout-btn').addEventListener('click', ()=>signOut(auth));

const RAW = JSON.parse(document.getElementById('raw-data').textContent);
const BASE_DATA = JSON.parse(JSON.stringify(RAW));
const fmtEUR = n => n.toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});

// ================= EDITING LIVE CLIENTI (Firestore) =================
const CLIENTI_COLLECTIONS = {gnocca:'clienti_gnocca', no_tutor:'clienti_no_tutor', disattivate:'clienti_disattivate'};
const clientOverrides = {gnocca:{}, no_tutor:{}, disattivate:{}};

function clientDocId(d){
  if(d._id) return d._id;
  return slug((d.cliente||'') + '-' + (d.inizio||'')) || ('cliente-' + Date.now());
}

function rebuildDataset(key){
  const overrides = clientOverrides[key];
  const seenIds = new Set();
  const merged = [];
  BASE_DATA[key].forEach(base=>{
    const id = clientDocId(base);
    seenIds.add(id);
    const ov = overrides[id];
    if(ov && ov._deleted) return;
    merged.push(ov ? {...ov, _id:id} : {...base, _id:id});
  });
  Object.keys(overrides).forEach(id=>{
    if(seenIds.has(id)) return;
    const ov = overrides[id];
    if(ov._deleted) return;
    merged.push({...ov, _id:id});
  });
  RAW[key] = merged;
  updatePillCounts();
  rerenderDataset(key);
}

function updatePillCounts(){
  document.querySelectorAll('.pill-btn[data-dataset="gnocca"]').forEach(b=>b.textContent = `Gnocca (${RAW.gnocca.length})`);
  document.querySelectorAll('.pill-btn[data-dataset="no_tutor"]').forEach(b=>b.textContent = `No Tutor (${RAW.no_tutor.length})`);
  document.querySelectorAll('.pill-btn[data-dataset="disattivate"]').forEach(b=>b.textContent = `Disattivate (${RAW.disattivate.length})`);
  document.querySelectorAll('.side-count[data-dataset="gnocca"]').forEach(b=>b.textContent = `(${RAW.gnocca.length})`);
  document.querySelectorAll('.side-count[data-dataset="no_tutor"]').forEach(b=>b.textContent = `(${RAW.no_tutor.length})`);
  document.querySelectorAll('.side-count[data-dataset="disattivate"]').forEach(b=>b.textContent = `(${RAW.disattivate.length})`);
}

function rerenderDataset(key){
  if(typeof renderedViews==='undefined') return;
  if(renderedViews['analisi_'+key]){
    if(key==='gnocca') renderGnoccaAnalisi();
    if(key==='no_tutor') renderNoTutorAnalisi();
    if(key==='disattivate') renderDisattivateAnalisi();
  }
  if(key==='no_tutor'){
    if(typeof sectionInitialized!=='undefined' && sectionInitialized.no_tutor) renderNoTutorClienti();
  } else if(renderedViews['clienti_'+key]){
    if(key==='gnocca') renderGnoccaClienti();
    if(key==='disattivate') renderDisattivateClienti();
  }
  if(key==='gnocca'){
    renderRiepilogoGlobale();
    if(typeof sectionInitialized!=='undefined' && sectionInitialized.scadenze) renderScadenze();
  }
  if(typeof sectionInitialized!=='undefined' && sectionInitialized.impostazioni) renderImpostazioni();
}

const SETTINGS_COLLECTION = 'impostazioni_dashboard';
const SETTINGS_DOC_ID = 'opzioni';
function saveOptionList(key){
  setDoc(doc(db, SETTINGS_COLLECTION, SETTINGS_DOC_ID), {[key]: OPTION_LISTS[key]}, {merge:true});
}
function addOptionValue(key, value){
  value = (value||'').trim();
  if(!value) return;
  const arr = OPTION_LISTS[key];
  if(arr.includes(value)) return;
  arr.push(value);
  saveOptionList(key);
  renderImpostazioni();
}
function removeOptionValue(key, value){
  const arr = OPTION_LISTS[key];
  const idx = arr.indexOf(value);
  if(idx===-1) return;
  arr.splice(idx,1);
  saveOptionList(key);
  renderImpostazioni();
}

function showToast(message, type){
  type = type || 'info';
  const stack = document.getElementById('toast-stack');
  if(!stack) return;
  const icon = type==='success' ? 'fa-circle-check' : type==='error' ? 'fa-circle-exclamation' : 'fa-circle-info';
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;

}

function downloadCSV(filename, rows, columns){
  const escCsv = v=>{
    const s = (v==null?'':String(v));
    return /[",\n;]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const header = columns.map(c=>escCsv(c.label)).join(';');
  const lines = rows.map(r=>columns.map(c=>escCsv(typeof c.value==='function' ? c.value(r) : r[c.key])).join(';'));
  const csv = String.fromCharCode(65279) + [header, ...lines].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function itToIsoDate(it){
  if(!it) return '';
  const parts = it.split('/');
  if(parts.length!==3) return '';
  const [d,m,y] = parts;
  return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
}
function isoToItDate(iso){
  if(!iso) return '';
  const parts = iso.split('-');
  if(parts.length!==3) return '';
  const [y,m,d] = parts;
  return `${d}/${m}/${y}`;
}

function cmFieldHtml(f, val){
  if(f.type==='select'){
    if(f.allowBlank){
      let opts = f.options.slice();
      if(val && !opts.includes(val)) opts = opts.concat([val]);
      const optsHtml = ['<option value="">-- seleziona --</option>'].concat(
        opts.map(o=>`<option value="${escAttr(o)}" ${o===val?'selected':''}>${o}</option>`)
      ).join('');
      return `<label class="cm-field"><span>${f.label}</span><select data-key="${f.key}">${optsHtml}</select></label>`;
    }
    return `<label class="cm-field"><span>${f.label}</span><select data-key="${f.key}">${f.options.map(o=>`<option value="${o}" ${o===val?'selected':''}>${o}</option>`).join('')}</select></label>`;
  }
  if(f.type==='textarea'){
    return `<label class="cm-field cm-wide"><span>${f.label}</span><textarea data-key="${f.key}" rows="2">${escHtml(val)}</textarea></label>`;
  }
  if(f.type==='date'){
    return `<label class="cm-field"><span>${f.label}</span><input type="date" data-key="${f.key}" value="${escAttr(itToIsoDate(val))}"></label>`;
  }
  return `<label class="cm-field"><span>${f.label}</span><input type="${f.type==='number'?'number':'text'}" ${f.type==='number'?'step="0.01"':''} data-key="${f.key}" value="${escAttr(val)}"></label>`;
}
function openClientModal(dataset, id){
  const cfg = FIELD_CONFIGS[dataset];
  const isNew = !id;
  const record = isNew ? {} : (RAW[dataset].find(r=>clientDocId(r)===id) || {});
  const groups = [];
  const groupIndex = {};
  cfg.forEach(f=>{
    const g = f.group || 'Altro';
    if(groupIndex[g]===undefined){ groupIndex[g] = groups.length; groups.push({name:g, fields:[]}); }
    groups[groupIndex[g]].fields.push(f);
  });
  modalContext = {dataset, id: isNew ? null : id, isNew, record, groups, step:0, values:{...record}};
  document.getElementById('cm-title').textContent = isNew ? 'Nuovo cliente' : `Modifica: ${record.cliente||''}`;
  renderModalStep();
  document.getElementById('client-modal-overlay').style.display = 'flex';
}
function renderModalStep(){
  const {groups, step} = modalContext;
  const g = groups[step];
  document.getElementById('cm-fields').innerHTML = `
    <div class="cm-group">
      <p class="cm-group-title">${escHtml(g.name)}</p>
      <div class="cm-fields">${g.fields.map(f=>cmFieldHtml(f, modalContext.values[f.key])).join('')}</div>
    </div>
  `;
  document.getElementById('cm-steps').innerHTML = groups.map((gr,i)=>{
    const cls = i===step ? 'active' : i<step ? 'done' : '';
    const dot = `<span class="cm-step-dot ${cls}">${i+1}</span>`;
    return i < groups.length-1 ? dot + '<span class="cm-step-line"></span>' : dot;
  }).join('');
  document.getElementById('cm-back').style.display = step===0 ? 'none' : 'inline-flex';
  document.getElementById('cm-next').style.display = step===groups.length-1 ? 'none' : 'inline-flex';
  document.getElementById('cm-save').style.display = step===groups.length-1 ? 'inline-flex' : 'none';
}
function captureStepValues(){
  const {groups, step} = modalContext;
  let valid = true;
  groups[step].fields.forEach(f=>{
    const el = document.querySelector(`#cm-fields [data-key="${f.key}"]`);
    if(!el) return;
    let v = el.value;
    if(f.type==='number'){ v = v==='' ? 0 : (parseFloat(String(v).replace(',','.'))||0); }
    else if(f.type==='date'){ v = isoToItDate(v); }
    if(f.required && !String(v).trim()){ valid=false; el.style.borderColor = '#e34948'; }
    else{ el.style.borderColor = ''; }
    modalContext.values[f.key] = v;
  });
  return valid;
}

async function deleteClient(dataset, id){
  const ok = await showConfirm('Eliminare questo cliente? La modifica è condivisa con tutto il team. Potrai ripristinarla dal Cestino in Impostazioni.', {okLabel:'Elimina', danger:true});
  if(!ok) return;
  const record = RAW[dataset].find(r=>clientDocId(r)===id) || {};
  const payload = {...record, _deleted:true};
  delete payload._id;
  setDoc(doc(db, CLIENTI_COLLECTIONS[dataset], id), payload)
    .then(()=>showToast('Cliente eliminata.', 'success'))
    .catch(err=>showToast('Errore: ' + err.message, 'error'));
}

  setDoc(doc(db, CLIENTI_COLLECTIONS[dataset], id), {_deleted:false}, {merge:true})
    .then(()=>{
      if(typeof sectionInitialized!=='undefined' && sectionInitialized.impostazioni) renderImpostazioni();
      showToast('Cliente ripristinata.', 'success');

    .catch(err=>showToast('Errore nel ripristino: ' + err.message, 'error'));

function moveGnoccaToDisattivate(gnoccaPayload, oldGnoccaId, statoFinale){
  const today = new Date();
  const todayStr = String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0')+'/'+today.getFullYear();
  const noteSuffix = `[Spostata da Gnocca il ${todayStr} - ${statoFinale}]`;
  const disattivatoPayload = {
    cliente: gnoccaPayload.cliente,
    stato: statoFinale,
    email: gnoccaPayload.email || '',
    telefono: gnoccaPayload.telefono || '',
    percorso: gnoccaPayload.percorso || '',
    inizio: gnoccaPayload.inizio || '',
    fine: gnoccaPayload.fine || '',
    pagamento: gnoccaPayload.pagamento || '',
    importo: gnoccaPayload.importo || 0,
    nutrizione: gnoccaPayload.nutrizione || '',
    lezioni_pt: '',
    programma: gnoccaPayload.programma || '',
    note: (gnoccaPayload.note ? gnoccaPayload.note + ' ' : '') + noteSuffix,
    venditore: gnoccaPayload.venditore || '',
  };
  const disattivatoId = slug((disattivatoPayload.cliente||'') + '-' + (disattivatoPayload.inizio||'')) || ('cliente-' + Date.now());
  const tasks = [setDoc(doc(db, CLIENTI_COLLECTIONS.disattivate, disattivatoId), disattivatoPayload)];
  if(oldGnoccaId){
    tasks.push(setDoc(doc(db, CLIENTI_COLLECTIONS.gnocca, oldGnoccaId), {_deleted:true}));
  }
  return Promise.all(tasks);
}

document.getElementById('cm-next').addEventListener('click', ()=>{

document.getElementById('cm-save').addEventListener('click', async ()=>{
  if(!modalContext) return;
  const valid = captureStepValues();
  if(!valid){ showToast('Il campo Cliente è obbligatorio.', 'error'); return; }
  const {dataset, id, isNew, record, values} = modalContext;
  const payload = {...record, ...values};
  delete payload._id;

  if(isNew){
    const nameNorm = (payload.cliente||'').trim().toLowerCase();
    const dup = nameNorm && RAW[dataset].find(r=>(r.cliente||'').trim().toLowerCase()===nameNorm);
    if(dup){
      const proceed = await showConfirm(`Esiste già una cliente con questo nome in questo elenco (${dup.cliente}, inizio ${dup.inizio||'n/d'}). Vuoi salvare comunque un nuovo cliente?`, {okLabel:'Salva comunque'});
      if(!proceed) return;
    }
  }

  if(dataset==='gnocca' && (payload.stato==='ABBANDONO' || payload.stato==='NON RINNOVO')){
    moveGnoccaToDisattivate(payload, isNew ? null : id, payload.stato)
      .then(()=>{ closeClientModal(); showToast('Cliente spostata in Disattivate.', 'success'); })
      .catch(err=>showToast('Errore nel salvataggio: ' + err.message, 'error'));
    return;
  }

  const docId = isNew ? (slug(payload.cliente) + '-' + Date.now()) : id;
  setDoc(doc(db, CLIENTI_COLLECTIONS[dataset], docId), payload)
    .then(()=>{ closeClientModal(); showToast('Cliente salvata.', 'success'); })
    .catch(err=>showToast('Errore nel salvataggio: ' + err.message, 'error'));
});
const COLORS = {blue:'#2a78d6',orange:'#eb6834',aqua:'#1baf7a',yellow:'#eda100',magenta:'#e87ba4',green:'#008300',violet:'#4a3aa7',red:'#e34948',gray:'#9a998f'};
const palette = [COLORS.blue,COLORS.orange,COLORS.aqua,COLORS.yellow,COLORS.magenta,COLORS.violet,COLORS.red,COLORS.gray];
const STATO_COLORS = {'IN PERCORSO':COLORS.green,'SOSPESA':COLORS.blue,'SPARITA':COLORS.yellow,'ABBANDONO':COLORS.red,'NON RINNOVO':COLORS.violet};
const SITU_COLORS = {'ATTIVA':COLORS.green,'POCO ATTIVA':COLORS.yellow,'NON ATTIVA':COLORS.red};
function colorsFor(labels, map){ return labels.map(l => map[l] || COLORS.gray); }

function parseDate(s){
  if(!s) return null;
  const [d,m,y] = s.split('/');
  if(!y) return null;
  return new Date(+y, +m-1, +d);
}
function countBy(arr, key){
  const m = {};
  arr.forEach(d=>{ const k = d[key] || 'Non specificato'; m[k] = (m[k]||0)+1; });
  return m;
}
function sumBy(arr, key, valKey){
  const m = {};
  arr.forEach(d=>{ const k = d[key] || 'Non specificato'; m[k] = (m[k]||0)+d[valKey]; });
  return m;
}
function renderLegend(el, labels, values, colors, isCurrency){
  el.innerHTML = labels.map((l,i)=>`
    <span class="legend-item"><span class="dot" style="background:${colors[i % colors.length]}"></span>${l}: ${isCurrency? fmtEUR(values[i]) : values[i]}</span>
  `).join('');
}
// ================= COLORE AUTOMATICO PER VALORI NUOVI (Impostazioni) =================
const AUTO_BADGE_PALETTE = [
  {bg:'#fdf1d6', fg:'#8a5a00'}, {bg:'#fcebeb', fg:'#791f1f'}, {bg:'#dcedfa', fg:'#0f5c96'},
  {bg:'#eaf3de', fg:'#27500a'}, {bg:'#fbe4ec', fg:'#9c1f56'}, {bg:'#e2e6ec', fg:'#37424f'},
  {bg:'#fbe3d3', fg:'#8a3c0a'}, {bg:'#e6f1fb', fg:'#0c447c'}, {bg:'#efe3fb', fg:'#5a2a91'},
  {bg:'#e3fbf0', fg:'#0a6b46'}
];
function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
const autoBadgeClasses = new Set();
function ensureAutoBadgeClass(value){
  const h = hashStr(value||'');
  const cls = 'b-auto-' + h.toString(36);
  if(!autoBadgeClasses.has(cls)){
    const p = AUTO_BADGE_PALETTE[h % AUTO_BADGE_PALETTE.length];
    const styleEl = document.getElementById('auto-badge-styles');
    if(styleEl) styleEl.appendChild(document.createTextNode(`.${cls}{background:${p.bg}; color:${p.fg};}`));
    autoBadgeClasses.add(cls);
  }
  return cls;
}
function statoBadgeClass(s){
  if(s==='IN PERCORSO') return 'b-attivo';
  if(s==='SOSPESA') return 'b-sospesa';
  if(s==='SPARITA') return 'b-sparita';
  if(s==='MAI INIZIATO') return 'b-mainiziato';
  if(s==='ABBANDONO') return 'b-abbandono';
  if(s==='NON RINNOVO') return 'b-non-rinnovo';
  return 'b-vuoto';
}
function percorsoBadgeClass(p){
  const up = (p||'').toUpperCase();
  if(up.includes('GNOCCA 4 LIFE')) return 'b-perc-gnocca4life';
  if(up.includes('PROMO ESTATE')) return 'b-perc-promo';
  if(up.includes('6 MESI') && up.includes('GNOCCA')) return 'b-perc-6-6gnocca';
  if(up.includes('4 MESI')) return 'b-perc-4';
  if(up.includes('12 MESI')) return 'b-perc-12';
  if(up.includes('6 MESI')) return 'b-perc-6';
  if(up.includes('REFERRAL')) return 'b-perc-referral';
  if(!p) return 'b-perc-altro';
  return ensureAutoBadgeClass(p);
}
function situazioneBadgeClass(s){
  const up = (s||'').toUpperCase();
  if(up==='ATTIVA') return 'b-situ-attiva';
  if(up==='POCO ATTIVA') return 'b-situ-poco';
  if(up==='NON ATTIVA') return 'b-situ-non';
  return 'b-situ-altro';
}
function venditoreHtml(v){
  if(!v) return v;
  if(v==='Non specificato') return '-';
  let cls = null;
  if(v==='Salvatore') cls = 'b-vend-salvatore';
  else if(v==='Personal_G') cls = 'b-vend-personalg';
  else if(v==='Peppe') cls = 'b-vend-peppe';
  else cls = ensureAutoBadgeClass(v);
  return `<span class="badge ${cls}">${escHtml(v)}</span>`;
}
let chartInstances = {};
function makeChart(id, config){
  if(chartInstances[id]) chartInstances[id].destroy();
  chartInstances[id] = new Chart(document.getElementById(id), config);
}
function updateFilterIconState(select){
  const wrapper = select.closest('.filter-select');
  if(!wrapper) return;
  const hasValue = !!select.value;
  wrapper.classList.toggle('active', hasValue);
  const label = wrapper.dataset.label || '';
  select.title = hasValue ? `${label}: ${dispVal(select.options[select.selectedIndex].textContent)}` : label;
}
function populateSelect(id, data, key){
  const sel = document.getElementById(id);
  const vals = [...new Set(data.map(d=>d[key]))].filter(v=>v).sort();
  vals.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=dispVal(v); sel.appendChild(o); });
}
function dispVal(v){ return (v==='Non assegnato' || v==='Nessuno' || v==='Non specificata' || v==='Non specificato') ? '-' : v; }
function ptExtraHtml(v){
  const disp = dispVal(v);
  if(disp==='-') return disp;
  let cls = null;
  if(v==='Fiorenzo') cls = 'b-pt-fiorenzo';
  else if(v==='Matteo') cls = 'b-pt-matteo';
  else if(v==='Federica') cls = 'b-pt-federica';
  else if(v==='Gianmiki') cls = 'b-pt-gianmiki';
  else if(v==='Marco') cls = 'b-pt-marco';
  else cls = ensureAutoBadgeClass(v);
  return `<span class="badge ${cls}">${escHtml(disp)}</span>`;
}
function nutriHtml(v){
  const disp = dispVal(v);
  if(disp==='-') return disp;
  let cls = null;
  if(v==='Nicole') cls = 'b-nutri-nicole';
  else if(v==='Alessia') cls = 'b-nutri-alessia';
  else if(v==='Vanessa') cls = 'b-nutri-vanessa';
  else if(v==='Sofia') cls = 'b-nutri-sofia';
  else if(v==='Matilde') cls = 'b-nutri-matilde';
  else cls = ensureAutoBadgeClass(v);
  return `<span class="badge ${cls}">${escHtml(disp)}</span>`;
}

// ================= GESTIONE SCADENZE (contatti / rinnovi Gnocca) =================
function contattiId(d){ return slug(d.cliente + '-' + d.inizio); }

function contattoSelectClass(v){
  if(v==='Contattato') return 'st-contattato';
  if(v==='Rinnovato') return 'st-rinnovato';
  if(v==='Non rinnova') return 'st-non-rinnova';
  return 'st-da-contattare';
}

function contattiGgInfo(fineDate, today){
  const diffDays = Math.round((fineDate - today)/86400000);
  let cls = 'gg-ok';
  if(diffDays <= 14) cls = 'gg-urgent';
  else if(diffDays <= 30) cls = 'gg-soon';
  const label = diffDays === 0 ? 'oggi' : diffDays > 0 ? `${diffDays} gg` : `${Math.abs(diffDays)} gg fa`;
  return {cls, label};
}

function renderScadenze(){
  document.getElementById('scadenze-content').innerHTML = `
    <div class="panel">
      <h2>Gestione contatti - rinnovi</h2>
      <p class="desc">Ordinati per data di fine percorso. Stato e note sono condivisi in tempo reale con il team.</p>
      <span class="sync-tag"><span class="sync-dot"></span>Sincronizzato in tempo reale</span>
      <div class="filters">
        <input type="text" id="gc-search" placeholder="Cerca cliente...">
        <select id="gc-filter-stato-contatto">
          <option value="">Tutti gli stati contatto</option>
          <option value="Da contattare">Da contattare</option>
          <option value="Contattato">Contattato</option>

  `;

function renderContattiList(data){
  const rows = data.filter(d=>parseDate(d.fine)).sort((a,b)=>parseDate(a.fine)-parseDate(b.fine));
  const today = new Date(); today.setHours(0,0,0,0);
  const container = document.getElementById('gc-list');
  const statoOpts = ['Da contattare','Contattato','Rinnovato','Non rinnova'];

  function draw(list){
    container.innerHTML = list.map(d=>{
      const id = contattiId(d);
      const fineDate = parseDate(d.fine);
      const {cls, label} = contattiGgInfo(fineDate, today);
      const state = contattiState[id] || {};
      const statoContatto = state.stato_contatto || 'Da contattare';
      const nota = escAttr(state.nota || '');
      const optionsHtml = statoOpts.map(o=>`<option value="${o}" ${o===statoContatto?'selected':''}>${o}</option>`).join('');
      return `
        <div class="contatto-row" data-id="${id}">
          <div class="cr-info">
            <span class="cr-nome" title="${escAttr(d.cliente)}">${escHtml(d.cliente)}</span>
            <span class="badge cr-badge-stato ${statoBadgeClass(d.stato)}">${escHtml(d.stato)}</span>
            <span class="badge cr-badge-percorso ${percorsoBadgeClass(d.percorso)}">${escHtml(d.percorso)}</span>
          </div>
          <div class="cr-date">
            <span class="cr-data">${escHtml(d.fine)}</span>
            <span class="cr-gg ${cls}">${escHtml(label)}</span>
          </div>
          <select class="cr-select ${contattoSelectClass(statoContatto)}" data-id="${id}">${optionsHtml}</select>
          <input type="text" class="cr-note" data-id="${id}" placeholder="nota..." value="${nota}">
        </div>`;
    }).join('');

    container.querySelectorAll('.cr-select').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        sel.className = `cr-select ${contattoSelectClass(sel.value)}`;
        setDoc(doc(db, CONTATTI_COLLECTION, sel.dataset.id), {stato_contatto: sel.value}, {merge:true});
      });
    });
    const noteTimers = {};
    container.querySelectorAll('.cr-note').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const id2 = inp.dataset.id;
        clearTimeout(noteTimers[id2]);
        noteTimers[id2] = setTimeout(()=>{
          setDoc(doc(db, CONTATTI_COLLECTION, id2), {nota: inp.value}, {merge:true});
        }, 600);
      });
    });
  }

  function applyFilters(){
    const search = document.getElementById('gc-search').value.toLowerCase();
    const fStato = document.getElementById('gc-filter-stato-contatto').value;
    const filtered = rows.filter(d=>{
      if(search && !d.cliente.toLowerCase().includes(search)) return false;
      if(fStato){
        const id = contattiId(d);
        const cur = (contattiState[id]||{}).stato_contatto || 'Da contattare';
        if(cur !== fStato) return false;
      }
      return true;
    });
    draw(filtered);
  }

  document.getElementById('gc-search').addEventListener('input', applyFilters);
  document.getElementById('gc-filter-stato-contatto').addEventListener('change', applyFilters);

  contattiListeners.push((id, docData)=>{
    const row = container.querySelector(`.contatto-row[data-id="${CSS.escape(id)}"]`);
    if(!row) return;
    const sel = row.querySelector('.cr-select');
    const inp = row.querySelector('.cr-note');

            </span>
          </div>
        </td>
      </tr>`).join('');
  }
  el.querySelectorAll('#nt-table th').forEach(th=>{
    th.addEventListener('click', ()=>{ const key=th.dataset.key; if(sort.key===key) sort.dir*=-1; else {sort.key=key; sort.dir=1;} renderTable(); });
  });
  ['nt-search','nt-stato','nt-trainer','nt-nutri'].forEach(id=>document.getElementById(id).addEventListener('input', renderTable));
  renderTable();
}

    th.addEventListener('click', ()=>{ const key=th.dataset.key; if(sort.key===key) sort.dir*=-1; else {sort.key=key; sort.dir=1;} renderTable(); });
  });
  ['d-search','d-percorso','d-venditore','d-pagamento'].forEach(id=>document.getElementById(id).addEventListener('input', renderTable));
  renderTable();
}

// ================= RIEPILOGO GLOBALE (Dashboard) =================
let dashboardMonthDate = (function(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
function monthKeyFromDate(dt){ return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`; }
function statusEventDate(d){
  if(d.note){
    const m = d.note.match(/Spostata da Gnocca il (\d{2}\/\d{2}\/\d{4})/);
    if(m){ const dt = parseDate(m[1]); if(dt) return dt; }
  }
  // Nessuna data di uscita registrata: il record non viene conteggiato nello storico mensile
  // finche' non viene confermata la data reale (evita stime fuorvianti).
  return null;
}
function clientsByStatoInMonth(stato, monthKey){
  const pool = [...RAW.gnocca, ...RAW.disattivate].filter(x=>x.stato===stato);
  return pool.filter(x=>{
    const dt = statusEventDate(x);
    if(!dt) return false;
    return monthKeyFromDate(dt)===monthKey;
  });
}
const KPI_LABELS = {'':'Clienti totali', 'IN PERCORSO':'In percorso', 'SOSPESA':'Congelate', 'ABBANDONO':'Abbandonate', 'SPARITA':'Sparite', 'NON RINNOVO':'Non rinnovo'};
const KPI_MONTHLY_FILTERS = ['ABBANDONO', 'NON RINNOVO'];
function riepilogoDetailLabel(filter){
  const base = KPI_LABELS[filter] ?? '';
  if(KPI_MONTHLY_FILTERS.includes(filter)){
    const monthSub = dashboardMonthDate.toLocaleDateString('it-IT', {month:'short', year:'numeric'});
    return `${base} (${monthSub})`;
  }
  return base;
}
function renderDashMonthPicker(){
  const label = document.getElementById('dash-month-current');
  if(!label) return;
  label.textContent = dashboardMonthDate.toLocaleDateString('it-IT', {month:'long', year:'numeric'});
  const today = new Date();
  const isCurrentMonth = dashboardMonthDate.getFullYear()===today.getFullYear() && dashboardMonthDate.getMonth()===today.getMonth();
  const nextBtn = document.getElementById('dash-month-next');
  if(nextBtn) nextBtn.disabled = isCurrentMonth;
}
function riepilogoInScadenza(g, today){
  return g.filter(x=>{
    if(x.stato!=='IN PERCORSO') return false;
    const fd = parseDate(x.fine);
    if(!fd) return false;
    const diff = Math.round((fd-today)/86400000);
    return diff>=0 && diff<=30;
  });
}
function computeCardClients(filter){
  if(filter==='ABBANDONO' || filter==='NON RINNOVO'){
    return clientsByStatoInMonth(filter, monthKeyFromDate(dashboardMonthDate));
  }
  const g = RAW.gnocca;
  if(filter==='') return g;
  return g.filter(x=>x.stato===filter);
}
function riepilogoRowHtml(d, extra, gg){
  return `<div class="riepilogo-detail-row">
    <span class="rd-nome">${escHtml(d.cliente)}</span>
    <span class="badge rd-badge-stato ${statoBadgeClass(d.stato)}">${escHtml(d.stato)}</span>
    <span class="badge rd-badge-percorso ${percorsoBadgeClass(d.percorso)}">${escHtml(d.percorso)}</span>
    <span class="rd-fine">${escHtml(extra)}</span>
    ${gg ? `<span class="badge rd-gg badge-${gg.cls}">${escHtml(gg.label)}</span>` : ''}
  </div>`;
}
let openDetailFilter = null;
function renderRiepilogoDetail(){
  const panel = document.getElementById('riepilogo-detail');
  if(openDetailFilter===null){ panel.style.display='none'; panel.innerHTML=''; return; }
  const clients = computeCardClients(openDetailFilter).slice().sort((a,b)=>(parseDate(a.fine)||0)-(parseDate(b.fine)||0));
  panel.innerHTML = `
    <div class="panel riepilogo-detail-panel">
      <div class="riepilogo-detail-head">
        <h2>${riepilogoDetailLabel(openDetailFilter)} (${clients.length})</h2>
        <button type="button" class="btn-icon" id="riepilogo-detail-close"><i class="fa-solid fa-xmark"></i>Chiudi</button>
      </div>
      <div class="riepilogo-detail-list">
        ${clients.length ? clients.map(d=>riepilogoRowHtml(d, d.fine || '')).join('') : emptyStateHtml('fa-circle-check', 'Nessun cliente in questa categoria.')}
      </div>
    </div>
  `;
  panel.style.display='block';
  document.getElementById('riepilogo-detail-close').addEventListener('click', closeRiepilogoDetail);
}
function closeRiepilogoDetail(){
  openDetailFilter = null;
  renderRiepilogoDetail();
  document.querySelectorAll('.kpi-clickable').forEach(c=>c.classList.remove('kpi-open'));
}
function renderScadenzeMini(){
  const list = document.getElementById('scadenze-mini-list');
  const count = document.getElementById('scadenze-mini-count');
  if(!list) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const items = riepilogoInScadenza(RAW.gnocca, today).slice().sort((a,b)=>(parseDate(a.fine)||0)-(parseDate(b.fine)||0));
  if(count) count.textContent = items.length ? `· ${items.length}` : '';
  list.innerHTML = items.length
    ? items.map(d=>{
        const {cls, label} = contattiGgInfo(parseDate(d.fine), today);
        return riepilogoRowHtml(d, d.fine, {cls, label});
      }).join('')
    : emptyStateHtml('fa-circle-check', 'Nessuna scadenza nei prossimi 30 giorni.');
}
let scadenzeMiniOpen = false;
function toggleScadenzeMini(){
  scadenzeMiniOpen = !scadenzeMiniOpen;
  const list = document.getElementById('scadenze-mini-list');
  const chevron = document.getElementById('scadenze-mini-chevron');
  const toggle = document.getElementById('scadenze-mini-toggle');
  if(list) list.style.display = scadenzeMiniOpen ? 'flex' : 'none';
  if(chevron) chevron.classList.toggle('open', scadenzeMiniOpen);
  if(toggle) toggle.setAttribute('aria-expanded', scadenzeMiniOpen ? 'true' : 'false');
}
function renderGnoccaAndamentoChart(){
  const canvas = document.getElementById('g-chart-andamento');
  if(!canvas) return;
  const monthsBack = 6;
  const today = new Date(); today.setHours(0,0,0,0);
  const months = [];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(today.getFullYear(), today.getMonth()-i, 1);
    months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, label:d.toLocaleDateString('it-IT',{month:'short', year:'numeric'})});
  }
  const monthIndex = {};
  months.forEach((m,i)=>{ monthIndex[m.key] = i; });

  const ingressiArr = new Array(months.length).fill(0);
  const abbandoniArr = new Array(months.length).fill(0);

  [...RAW.gnocca, ...RAW.disattivate].forEach(c=>{
    const dt = parseDate(c.inizio);
    if(!dt) return;
    const k = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    if(monthIndex[k]!==undefined) ingressiArr[monthIndex[k]]++;
  });
  RAW.disattivate.forEach(c=>{
    const dt = statusEventDate(c);
    if(!dt) return;
    const k = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    if(monthIndex[k]!==undefined) abbandoniArr[monthIndex[k]]++;
  });

  makeChart('g-chart-andamento', {
    type:'bar',
    data:{
      labels: months.map(m=>m.label),
      datasets:[
        {label:'Nuovi ingressi', data:ingressiArr, backgroundColor:COLORS.green, borderRadius:4, maxBarThickness:28},
        {label:'Abbandoni', data:abbandoniArr, backgroundColor:COLORS.red, borderRadius:4, maxBarThickness:28},
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:true, ticks:{stepSize:1, precision:0}, grid:{color:'#e4e3dd'}},
        x:{grid:{display:false}}
      }
    }
  });
}
function renderRiepilogoGlobale(){
  const g = RAW.gnocca;
  const monthKey = monthKeyFromDate(dashboardMonthDate);
  const monthSub = dashboardMonthDate.toLocaleDateString('it-IT', {month:'short', year:'numeric'});

  const totaleClienti = g.length;
  const inPercorso = g.filter(x=>x.stato==='IN PERCORSO').length;
  const congelate = g.filter(x=>x.stato==='SOSPESA').length;
  const abbandonateMese = clientsByStatoInMonth('ABBANDONO', monthKey).length;
  const sparite = g.filter(x=>x.stato==='SPARITA').length;
  const nonRinnovoMese = clientsByStatoInMonth('NON RINNOVO', monthKey).length;

  const cards = [
    {label:'Clienti totali', value: totaleClienti, icon:'fa-users', bg:'#ffffff', color:'#18181a', filter:''},
    {label:'In percorso', value: inPercorso, icon:'fa-route', bg:'#eaf3de', color:'#27500a', filter:'IN PERCORSO'},
    {label:'Congelate', value: congelate, icon:'fa-snowflake', bg:'#e6f1fb', color:'#0c447c', filter:'SOSPESA'},
    {label:'Abbandonate', value: abbandonateMese, sub: monthSub, icon:'fa-user-slash', bg:'#fcebeb', color:'#791f1f', filter:'ABBANDONO'},
    {label:'Sparite', value: sparite, icon:'fa-ghost', bg:'#faeeda', color:'#633806', filter:'SPARITA'},
    {label:'Non rinnovo', value: nonRinnovoMese, sub: monthSub, icon:'fa-calendar-xmark', bg:'#efe9fb', color:'#4a3aa7', filter:'NON RINNOVO'},
  ];
  document.getElementById('riepilogo-globale').innerHTML = cards.map(k=>{
    const label = k.sub ? `${k.label} (${k.sub})` : k.label;
    return `<div class="kpi kpi-clickable${k.filter===openDetailFilter?' kpi-open':''}" data-filter="${k.filter}" data-label="${escAttr(label)}" style="background:${k.bg}; color:${k.color}; border:0.5px solid var(--border);"><i class="fa-solid ${k.icon} kpi-icon" style="color:${k.color};"></i><div class="label" style="color:${k.color}; opacity:0.75;">${k.label}</div><div class="value" style="color:${k.color};">${k.value}</div></div>`;
  }).join('');
  renderRiepilogoDetail();
  renderScadenzeMini();
  renderDashMonthPicker();
}
contattiListeners.push(()=>renderRiepilogoGlobale());
renderRiepilogoGlobale();
document.getElementById('riepilogo-globale').addEventListener('click', (e)=>{
  const card = e.target.closest('.kpi-clickable');
  if(!card) return;
  const filter = card.dataset.filter;
  if(openDetailFilter===filter){ closeRiepilogoDetail(); return; }
  openDetailFilter = filter;
  renderRiepilogoDetail();
  document.querySelectorAll('.kpi-clickable').forEach(c=>c.classList.toggle('kpi-open', c.dataset.filter===filter));
});
document.getElementById('scadenze-mini-vedi-tutte').addEventListener('click', (e)=>{ e.stopPropagation(); navigateTo('scadenze'); });
document.getElementById('scadenze-mini-toggle').addEventListener('click', (e)=>{
  if(e.target.closest('#scadenze-mini-vedi-tutte')) return;
  toggleScadenzeMini();
});
document.getElementById('scadenze-mini-toggle').addEventListener('keydown', (e)=>{
  if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleScadenzeMini(); }
});
document.getElementById('dash-month-prev').addEventListener('click', ()=>{
  dashboardMonthDate = new Date(dashboardMonthDate.getFullYear(), dashboardMonthDate.getMonth()-1, 1);
  renderRiepilogoGlobale();
});
document.getElementById('dash-month-next').addEventListener('click', ()=>{
  const today = new Date();
  const isCurrentMonth = dashboardMonthDate.getFullYear()===today.getFullYear() && dashboardMonthDate.getMonth()===today.getMonth();
  if(isCurrentMonth) return;
  dashboardMonthDate = new Date(dashboardMonthDate.getFullYear(), dashboardMonthDate.getMonth()+1, 1);
  renderRiepilogoGlobale();
});

// ================= NAVIGAZIONE =================
const renderedViews = {};
function ensureRendered(key, fn){
  if(!renderedViews[key]){ fn(); renderedViews[key] = true; }
}

function showDataset(section, dataset){
  const sectionEl = document.getElementById('section-'+section);
  sectionEl.querySelectorAll('.pill-btn').forEach(b=>b.classList.toggle('active', b.dataset.dataset===dataset));
  sectionEl.querySelectorAll('.dataset-panel').forEach(p=>p.classList.toggle('active', p.id===section+'-'+dataset));
  const key = section+'_'+dataset;
  ensureRendered(key, ()=>{
    if(section==='clienti'){
      if(dataset==='gnocca') renderGnoccaClienti();
      if(dataset==='no_tutor') renderNoTutorClienti();
      if(dataset==='disattivate') renderDisattivateClienti();
    } else if(section==='analisi'){
      if(dataset==='gnocca') renderGnoccaAnalisi();
      if(dataset==='no_tutor') renderNoTutorAnalisi();
      if(dataset==='disattivate') renderDisattivateAnalisi();
    }
  });
}

const sectionInitialized = {clienti:false, no_tutor:false, analisi:false, scadenze:false, impostazioni:false};
function navigateTo(section){
  document.querySelectorAll('.side-btn[data-nav]').forEach(b=>{
    b.classList.toggle('active', b.dataset.nav===section);
  });
  document.querySelectorAll('.app-section').forEach(s=>s.classList.toggle('active', s.id==='section-'+section));
  if(section==='clienti' && !sectionInitialized.clienti){
    showDataset('clienti', 'gnocca'); sectionInitialized.clienti=true;
  } else if(section==='no_tutor' && !sectionInitialized.no_tutor){
    renderNoTutorClienti(); sectionInitialized.no_tutor=true;
  } else if(section==='analisi' && !sectionInitialized.analisi){
    showDataset('analisi','gnocca'); sectionInitialized.analisi=true;
  } else if(section==='scadenze' && !sectionInitialized.scadenze){
    renderScadenze(); sectionInitialized.scadenze=true;
  } else if(section==='impostazioni'){
    renderImpostazioni(); sectionInitialized.impostazioni=true;
  }
}

document.querySelectorAll('.side-btn[data-nav]').forEach(b=>{
  b.addEventListener('click', ()=>navigateTo(b.dataset.nav));
});
document.querySelectorAll('#section-clienti .pill-btn').forEach(b=>{
  b.addEventListener('click', ()=>showDataset('clienti', b.dataset.dataset));
});
document.querySelectorAll('#section-analisi .pill-btn').forEach(b=>{
  b.addEventListener('click', ()=>showDataset('analisi', b.dataset.dataset));
});

// ================= MESSAGGIO WHATSAPP =================
let waContext = null;
function waDigits(v){
  let d = (v+'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(!d.startsWith('39')) d = '39' + d;
  return d;
}
function waDisplayNumber(v){
  if(!v) return '';
  const s = (v+'').trim();
  if(s.startsWith('+')) return s;
  return '+39 ' + s;
}
function waTemplate(kind, ctx){
  const nome = (ctx.cliente||'').trim().split(/\s+/)[0] || ctx.cliente || '';
  if(kind==='check'){
    return `Ciao ${nome}, ti scrivo per il check mensile del tuo percorso${ctx.percorso ? ' ('+ctx.percorso+')' : ''}. Fammi sapere come sta andando!`;
  }
  if(kind==='pagamento'){
    return `Ciao ${nome}, ti contatto per un promemoria riguardo al pagamento in sospeso. Restiamo in contatto!`;
  }
  return '';
}
function openWaModal(ctx){
  waContext = ctx;
  document.getElementById('wa-number-display').textContent = waDisplayNumber(ctx.telefono);
  document.querySelectorAll('#wa-pills .wa-pill').forEach(b=>b.classList.toggle('active', b.dataset.tpl==='check'));
  document.getElementById('wa-message').value = waTemplate('check', ctx);
  document.getElementById('wa-modal-overlay').style.display = 'flex';
}
function closeWaModal(){
  document.getElementById('wa-modal-overlay').style.display = 'none';
}
document.querySelectorAll('#wa-pills .wa-pill').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#wa-pills .wa-pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('wa-message').value = waTemplate(btn.dataset.tpl, waContext || {});
  });
});
document.getElementById('wa-open-btn').addEventListener('click', ()=>{
  if(!waContext) return;
  const digits = waDigits(waContext.telefono);
  if(!digits){ showToast('Numero di telefono non disponibile.', 'error'); return; }
  const text = encodeURIComponent(document.getElementById('wa-message').value || '');
  window.open(`https://wa.me/${digits}?text=${text}`, '_blank');
});
document.getElementById('wa-modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='wa-modal-overlay') closeWaModal(); });
document.addEventListener('click', (e)=>{
  const trigger = e.target.closest('.wa-trigger');
  if(!trigger) return;
  e.preventDefault();
  openWaModal({
    cliente: trigger.dataset.cliente,
    telefono: trigger.dataset.telefono,
    percorso: trigger.dataset.percorso,
  });
});

document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  const confirmOverlay = document.getElementById('confirm-overlay');
  if(confirmOverlay && confirmOverlay.style.display==='flex'){ closeConfirm(false); return; }
  const waOverlay = document.getElementById('wa-modal-overlay');
  if(waOverlay && waOverlay.style.display==='flex'){ closeWaModal(); return; }
  const modalOverlay = document.getElementById('client-modal-overlay');
  if(modalOverlay && modalOverlay.style.display==='flex'){ closeClientModal(); return; }
  if(typeof openDetailFilter!=='undefined' && openDetailFilter!==null){ closeRiepilogoDetail(); return; }
});
